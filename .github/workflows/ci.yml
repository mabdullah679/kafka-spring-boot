name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package the Spring consumer (no unit tests exist)
        run: mvn -B -q -f consumer-app/pom.xml package
      - name: Python syntax check
        run: python3 -m py_compile data-sync/app.py producer-stack/producer/producer.py
      - name: Validate compose files
        run: |
          docker network create eclipse-net
          docker compose -f producer-stack/docker-compose.yml config -q
          docker compose -f consumer-app/docker-compose.yml config -q
      - name: Shellcheck
        run: shellcheck -S warning tests/e2e.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack (short flush interval so the test finishes quickly)
        run: SYNC_INTERVAL_SECONDS=20 make up
      - name: End-to-end check
        run: ./tests/e2e.sh
      - name: Dump logs on failure
        if: failure()
        run: |
          docker logs --tail=100 spring-consumer || true
          docker logs --tail=100 data-sync || true
          docker logs --tail=50 kafka-producer || true
      - name: Tear down
        if: always()
        run: make destroy

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
